<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my-game</title>
<meta name="description" content="브라우저에서 바로 하는 3D 게임 모음">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root {
  /* Layout: 위에 제목, 아래로 게임 카드 격자 (넓은 화면 2열, 좁은 화면 1열) */
  --bg: #111214;
  --card: #1a1c1f;
  --card-hover: #202327;
  --ink: #ecebe6;
  --muted: #9b9a94;
  --accent: #f2c94c;
  --line: rgba(255, 255, 255, 0.09);
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
main {
  max-width: 1040px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 48px) 16px calc(env(safe-area-inset-bottom, 0px) + 48px);
}
header { margin-bottom: 32px; }
h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(36px, 7vw, 56px); line-height: 1.1; margin: 0 0 8px;
}
h1 span { color: var(--accent); }
header p { margin: 0; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.game {
  display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  color: inherit; text-decoration: none;
  transition: background 0.15s, transform 0.15s, border-color 0.15s;
}
.game:hover { background: var(--card-hover); border-color: rgba(242, 201, 76, 0.4); transform: translateY(-2px); }
.game:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.thumb { aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
.game:hover .thumb img { transform: scale(1.03); }
.body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.2; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 12px; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.desc { margin: 0; font-size: 15px; }
.keys { margin: 0; font-size: 13px; color: var(--muted); }
.play {
  margin-top: auto; align-self: flex-start;
  font-weight: 700; font-size: 14px; color: #17150f; background: var(--accent);
  padding: 8px 16px; border-radius: 8px;
}
footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
footer a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .game, .thumb img { transition: none; }
  .game:hover { transform: none; }
  .game:hover .thumb img { transform: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>my-<span>game</span></h1>
    <p>설치 없이 브라우저에서 바로 하는 3D 게임 모음</p>
  </header>
  <div class="grid" id="games"></div>
  <footer>
    소스: <a href="https://github.com/wuhjeon/my-game">github.com/wuhjeon/my-game</a>
  </footer>
</main>
<script>
// 게임을 추가할 때는 폴더를 만들고 이 목록에 한 줄 추가하면 된다
const GAMES = [
  {
    path: '%EC%A7%80%EC%83%81%EC%97%90%EC%84%9C%20%EB%B4%85%EC%8B%9C%EB%8B%A4/', // 지상에서 봅시다/
    title: '지상에서 봅시다',
    thumb: 'thumbs/elevator.jpg',
    tags: ['공포', '이상현상 찾기', '1인칭', '개발 중'],
    desc: '지하 8층에서 지상까지 한 층씩. 이상한 점이 없으면 ▲, 있으면 ▼. 문이 열려 있는 동안 내려서 층을 둘러볼 수 있다.',
    keys: 'WASD 이동 · 마우스 시점 · 버튼 클릭 · 터치 지원',
  },
  {
    path: 'endless-passage/',
    title: '끝없는 통로',
    thumb: 'thumbs/endless-passage.jpg',
    tags: ['공포', '이상현상 찾기', '1인칭'],
    desc: '반복되는 지하 통로. 이상한 점이 있으면 되돌아가고, 없으면 앞으로. 출구 8번까지 살아서 나가자.',
    keys: 'WASD 이동 · 마우스 시점 · 터치 지원',
  },
  {
    path: 'minesweeper/',
    title: '3D 지뢰찾기',
    thumb: 'thumbs/minesweeper.jpg',
    tags: ['퍼즐', '1인칭'],
    desc: '지뢰밭 위를 직접 뛰어다니며 칸을 연다. 깃발과 동시 열기(코드)까지 지원.',
    keys: '마우스/터치 · 점프 패드 이동',
  },
];

const grid = document.getElementById('games');
for (const g of GAMES) {
  const a = document.createElement('a');
  a.className = 'game';
  a.href = g.path;
  a.innerHTML = `
    <div class="thumb"><img loading="lazy" alt=""></div>
    <div class="body">
      <div class="title-row"><h2></h2></div>
      <div class="tags"></div>
      <p class="desc"></p>
      <p class="keys"></p>
      <span class="play">플레이</span>
    </div>`;
  a.querySelector('img').src = g.thumb;
  a.querySelector('h2').textContent = g.title;
  a.querySelector('.desc').textContent = g.desc;
  a.querySelector('.keys').textContent = g.keys;
  const tags = a.querySelector('.tags');
  for (const t of g.tags) {
    const s = document.createElement('span');
    s.className = 'tag';
    s.textContent = t;
    tags.appendChild(s);
  }
  grid.appendChild(a);
}
</script>
</body>
</html>
